<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#050505" />
    <title>From Victory</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #050505;
        color: #f5f5f0;
        font-family: "Manrope", "Segoe UI", sans-serif;
      }
      main {
        box-sizing: border-box;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      p {
        margin: 0;
        max-width: 22rem;
        line-height: 1.5;
        color: #b8b8b0;
        font-size: 0.95rem;
      }
      .fv-actions {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: 1.25rem;
        width: 100%;
        max-width: 18rem;
      }
      a {
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 44px;
        margin-top: 0.75rem;
        padding: 0.7rem 1.25rem;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 700;
        font-size: 0.95rem;
      }
      a.fv-retry {
        background: #dfaf37;
        color: #050505;
      }
      a.fv-saved {
        background: transparent;
        color: #f4c24f;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>From Victory</h1>
      <p>
        Training didn't load. Check your connection, then try again. If you
        saved a Pregame session on this device, open it below.
      </p>
      <div class="fv-actions">
        <a class="fv-retry" href="__FV_RETRY_URL__">Try again</a>
        <!--fv-saved-->
        <a class="fv-saved" href="__FV_PREGAME_URL__">Open a saved session</a>
        <!--/fv-saved-->
      </div>
    </main>
  </body>
</html>
