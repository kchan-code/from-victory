<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#050505" />
    <title>From Victory</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #050505;
        color: #f5f5f0;
        font-family: "Manrope", "Segoe UI", sans-serif;
      }
      main {
        box-sizing: border-box;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      p {
        margin: 0;
        max-width: 22rem;
        line-height: 1.5;
        color: #b8b8b0;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>From Victory</h1>
      <p>
        Connecting to training&hellip; If this screen stays up, check your
        network and reopen the app.
      </p>
    </main>
  </body>
</html>
