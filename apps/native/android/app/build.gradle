apply plugin: 'com.android.application'

// Optional release signing — copy apps/native/keystore.properties.example to
// android/keystore.properties (gitignored) and point storeFile at a keystore
// kept OUTSIDE the repo. Without that file, release builds remain unsigned
// (debug still works).
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// FV-664 — the ONE Play Billing build switch.
//
//   FV_PLAY_BILLING=1  -> billing library + FVPlayBillingPlugin + BuildConfig flag, and (via
//                         capacitor.config.ts, same env var) the "FVNativeShell/1 (play)" UA marker.
//   unset / "" / "0"   -> byte-for-byte today's 1.0.x shell: no billing dependency, no BILLING
//                         permission, no plugin class, bare "FVNativeShell/1" UA.
//
// The env var MUST be present for BOTH `npx cap sync` (writes capacitor.config.json, which carries
// the UA marker) and Gradle. verifyPlayBillingSwitch below fails any build where the two disagree.
def playBillingRaw = System.getenv('FV_PLAY_BILLING') ?: ''
if (!(playBillingRaw in ['', '0', '1'])) {
    throw new GradleException("FV_PLAY_BILLING must be unset, 0 or 1 (got '${playBillingRaw}')")
}
def playBillingEnabled = playBillingRaw == '1'
// Billing library: latest stable major on Google Maven at FV-664 time (9.1.0). Google's deprecation
// table: v9 must be replaced by 2028-08-31.
def playBillingLibraryVersion = '9.1.0'

android {
    namespace "com.fromvictoryapp.app"
    compileSdk rootProject.ext.compileSdkVersion
    buildFeatures {
        // Only to carry BuildConfig.FV_PLAY_BILLING for MainActivity's registration gate.
        buildConfig true
    }
    defaultConfig {
        buildConfigField 'boolean', 'FV_PLAY_BILLING', playBillingEnabled.toString()
        // Play Console locked this applicationId (immutable).
        applicationId "com.fromvictoryapp.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 10
        versionName "1.0.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    if (keystorePropertiesFile.exists()) {
        signingConfigs {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }
    sourceSets {
        // Pure-Java billing helper: always on the JVM unit-test path so its tests run in every
        // build, but compiled into the app only when the switch is on.
        test.java.srcDir 'src/playBillingCore/java'
        if (playBillingEnabled) {
            main.java.srcDir 'src/playBillingCore/java'
            main.java.srcDir 'src/playBilling/java'
        }
    }
    buildTypes {
        release {
            // FV-735 item 7 / FV-740: R8 stays off on purpose. proguard-rules.pro
            // is still the Capacitor stub. Enabling minify without keep rules and
            // a device smoke can strip the bridge, narration, or the Play Billing
            // reflection in MainActivity. Do not flip this in a store upload.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // FV-675: Auth Tab / Custom Tab for FVAuthPlugin (system-browser sign-in). Google-published
    // AndroidX library, no network or analytics of its own. Product + privacy reviewed with the plugin.
    implementation "androidx.browser:browser:$androidxBrowserVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    if (playBillingEnabled) {
        implementation "com.android.billingclient:billing:${playBillingLibraryVersion}"
    }
}

// FV-664 guard: the capacitor.config.json that `cap sync` generated and the Gradle switch must
// agree. Marker without plugin = a shell that tells the server it can sell but cannot; plugin
// without marker = a shell with billing the server will never offer. Both are release-blocking.
// Hooked onto every merge*Assets task, which every assemble*/bundle*/install* build depends on.
tasks.register('verifyPlayBillingSwitch') {
    def configJson = file('src/main/assets/capacitor.config.json')
    def expectPlay = playBillingEnabled
    inputs.property('expectPlay', expectPlay)
    doLast {
        if (!configJson.exists()) {
            if (expectPlay) {
                throw new GradleException("FV_PLAY_BILLING=1 but ${configJson} is missing. Run `FV_PLAY_BILLING=1 npx cap sync android` first.")
            }
            logger.warn("verifyPlayBillingSwitch: ${configJson} not found; run `npx cap sync android` before packaging.")
            return
        }
        def parsed = new groovy.json.JsonSlurper().parse(configJson)
        def baseToken = 'FVNativeShell/1'
        def playToken = 'FVNativeShell/1 (play)'
        // The TOP-LEVEL token is pinned exactly (it is also the legacy iOS token and must never
        // change). Feature tokens such as FVAuth/1 go on the android/ios keys, not here.
        if (parsed.appendUserAgent != baseToken) {
            throw new GradleException("capacitor.config.json top-level appendUserAgent must be '${baseToken}' (got '${parsed.appendUserAgent}').")
        }
        // Compare the EFFECTIVE Android token (the android key overrides the top-level one). Other
        // streams may append feature tokens AFTER the capability marker, e.g.
        // "FVNativeShell/1 (play) FVAuth/1" (FV-569), so match the marker as a prefix, never by
        // equality with the whole string.
        def effectiveUa = (parsed.android?.appendUserAgent ?: parsed.appendUserAgent) as String
        def hasBase = effectiveUa == baseToken || effectiveUa.startsWith(baseToken + ' ')
        def hasPlay = effectiveUa == playToken || effectiveUa.startsWith(playToken + ' ')
        if (!hasBase) {
            throw new GradleException("capacitor.config.json effective Android appendUserAgent '${effectiveUa}' must start with '${baseToken}'.")
        }
        if (expectPlay && !hasPlay) {
            throw new GradleException("FV_PLAY_BILLING=1 (billing plugin included) but the effective Android appendUserAgent is '${effectiveUa}', expected it to start with '${playToken}'. Re-run `FV_PLAY_BILLING=1 npx cap sync android`.")
        }
        if (!expectPlay && effectiveUa.contains('(play)')) {
            throw new GradleException("capacitor.config.json Android appendUserAgent '${effectiveUa}' carries the (play) marker but FV_PLAY_BILLING is not set (no billing plugin in this build). Re-run `npx cap sync android` WITHOUT FV_PLAY_BILLING, or set it for Gradle too.")
        }
    }
}
tasks.matching { it.name ==~ /merge.*Assets/ }.configureEach { dependsOn tasks.named('verifyPlayBillingSwitch') }

apply from: 'capacitor.build.gradle'

// Intentionally no google-services plugin apply. Push Notifications /
// Firebase are out of the native plugin allowlist (Web Push remains the
// MVP path). Do not reintroduce without product + privacy review.
