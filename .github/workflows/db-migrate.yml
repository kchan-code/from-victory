# FV-259 — auto-apply Supabase migrations on merge to main.
#
# Born from the 2026-06-12 production login outage: merging a supabase/** PR
# deploys the CODE instantly (Vercel auto-deploy) but the SCHEMA waited on a
# manual `supabase db push`. Prod ran 6 migrations behind the deployed code
# and requireAthlete()'s new column selects crashed every athlete login.
#
# This job pushes pending migrations on every push to main.
#
# Migrate-before-deploy (FV-731, reworked FV-777): this workflow is the ONE
# ordered production deployment lane. It runs on every push to main, not only
# pushes that touch supabase/migrations. When the Vercel env
# FV_MIGRATE_BEFORE_DEPLOY=1 is set, vercel.json ignoreCommand skips every
# production build from Vercel's git integration, and the only production
# deploy is the `vercel deploy --prod` at the end of this job, run with
# FV_DEPLOY_AFTER_MIGRATE=1 so that build is not skipped.
#
# Ordering: the concurrency group below runs one job at a time and never
# cancels a running one. For a migration commit M followed by a plain commit
# N, M's run finishes or fails before N's starts. If M's migration failed,
# nothing was deployed, and N's run retries `supabase db push --include-all`
# and deploys only if that succeeds. A failed migration blocks every later
# deploy until it is fixed.
#
# Stale runs: before deploying, the job checks that its commit is still the
# tip of main. If it is not (a newer push is queued, or someone re-ran an old
# run), it applies migrations but does not deploy, so an old checkout cannot
# replace newer production. The newer commit's run deploys.
#
# Manual run (workflow_dispatch, on main only): applies any pending migrations,
# then deploys the tip of main as of when the run was started (the checked-out
# github.sha), and only if it is still the tip when the deploy step is
# reached. A manual run on any other ref does nothing.
#
# Cost of the single lane: docs-only and CI-only pushes to main also run this
# job (a no-op db push, then a deploy). While the flag is off, Vercel's git
# integration still builds every push as well, so each push produces two
# production deployments and the old race remains. Order of operations and
# the rollback rules: docs/runbooks/rollback.md.
#
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID — set these BEFORE turning
#   on FV_MIGRATE_BEFORE_DEPLOY. With the flag on and these missing, nothing
#   deploys to production.
#
# Required repo secrets (KC sets these — the job fails LOUDLY without them):
#   SUPABASE_ACCESS_TOKEN — personal access token (supabase.com/dashboard/account/tokens)
#   SUPABASE_DB_PASSWORD  — the project's database password
# Project ref is not a secret; it is pinned below.

name: db-migrate

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: db-migrate-prod
  cancel-in-progress: false

jobs:
  push-migrations:
    name: Apply migrations to production
    # workflow_dispatch can be started on any branch. Only main may touch
    # the production schema or deploy production.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          # FV-616: pinned. `latest` resolved to CLI v3.0.0 (2026-11-02), which rejects [inbucket] in
          # supabase/config.toml and broke `supabase start`. Bump deliberately after migrating config to v3.
          version: 2.122.1

      - name: Fail loudly if secrets are missing
        env:
          HAS_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' && 'yes' || '' }}
          HAS_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD != '' && 'yes' || '' }}
        run: |
          missing=0
          [ -z "$HAS_ACCESS_TOKEN" ] && echo "::error::SUPABASE_ACCESS_TOKEN secret is not set — migrations NOT applied. Prod code may now be ahead of prod schema (the FV-259 outage class). Run 'supabase db push' manually and set the secret." && missing=1
          [ -z "$HAS_DB_PASSWORD" ] && echo "::error::SUPABASE_DB_PASSWORD secret is not set — migrations NOT applied. Run 'supabase db push' manually and set the secret." && missing=1
          exit $missing

      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref kumrgeosgzdlxgljbyju

      - name: Push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --include-all

      - name: List remote migration state (audit trail)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase migration list --linked

      # Runs only after "Push migrations" succeeds. A failed db push does not
      # promote code. CLI deploys still execute ignoreCommand; FV_DEPLOY_AFTER_MIGRATE
      # is the signal that schema is already current and the build must proceed.
      - name: Check whether a post-migration production deploy is configured
        id: vercel
        env:
          HAS_TOKEN: ${{ secrets.VERCEL_TOKEN != '' && 'yes' || '' }}
          HAS_ORG: ${{ secrets.VERCEL_ORG_ID != '' && 'yes' || '' }}
          HAS_PROJECT: ${{ secrets.VERCEL_PROJECT_ID != '' && 'yes' || '' }}
        run: |
          if [ -n "$HAS_TOKEN" ] && [ -n "$HAS_ORG" ] && [ -n "$HAS_PROJECT" ]; then
            echo "configured=yes" >> "$GITHUB_OUTPUT"
          else
            echo "configured=no" >> "$GITHUB_OUTPUT"
            echo "::warning::VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID are not all set. This job applied migrations but did not deploy. If Vercel env FV_MIGRATE_BEFORE_DEPLOY=1 is set, Vercel skips every production build and nothing ships until these secrets exist. Leave that flag unset until they do. See docs/runbooks/rollback.md."
          fi

      # A queued run for a newer push, or a re-run of an old run, must not put
      # an older checkout over newer production. Migrations above still applied.
      # A failed fetch fails the job, so nothing deploys.
      - name: Check this commit is still the tip of main
        id: tip
        if: steps.vercel.outputs.configured == 'yes'
        run: |
          git fetch --no-tags --depth=1 origin main
          tip="$(git rev-parse FETCH_HEAD)"
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "is_tip=yes" >> "$GITHUB_OUTPUT"
          else
            echo "is_tip=no" >> "$GITHUB_OUTPUT"
            echo "::notice::Not deploying $GITHUB_SHA: main is now at $tip. Migrations were applied. The run for the newer commit will deploy."
          fi

      - uses: actions/setup-node@v7
        if: steps.vercel.outputs.configured == 'yes' && steps.tip.outputs.is_tip == 'yes'
        with:
          node-version: "22"

      - name: Deploy production after migrations
        if: steps.vercel.outputs.configured == 'yes' && steps.tip.outputs.is_tip == 'yes'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install --global vercel@65.15.0
          vercel deploy --prod --yes --token "$VERCEL_TOKEN" \
            --build-env FV_DEPLOY_AFTER_MIGRATE=1
